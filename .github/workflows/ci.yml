name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04-arm
            toolchain: nightly-2026-09-15
          - os: xcode-27
            toolchain: stable
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      FZY_ORACLE: ${{ github.workspace }}/.work/tmp/fzy/fzy
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned fzy oracle
        run: |
          git init --quiet .work/tmp/fzy
          git -C .work/tmp/fzy fetch --depth 1 https://github.com/jhawthorn/fzy.git 34b88869d022e861da4846c4463aea3ddfb3ff30
          git -C .work/tmp/fzy checkout --detach FETCH_HEAD
          make -C .work/tmp/fzy fzy
      - name: Test
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: make test
